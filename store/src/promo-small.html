<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="common.css">
<style>
  body { width: 440px; height: 280px; background: var(--teal); color: #fff; }
  .wrap { display: flex; flex-direction: column; justify-content: center; height: 280px; padding: 0 28px; }
  .top { display: flex; align-items: center; gap: 14px; }
  .top img { width: 56px; height: 56px; }
  .title { font-size: 40px; font-weight: 800; letter-spacing: -0.5px; }
  .tag { margin: 12px 0 22px; font-size: 19px; color: var(--gold); }
  .memes { display: flex; gap: 10px; }
  .memes img { width: 70px; height: 70px; object-fit: cover; border-radius: 4px; }
</style>
<div class="wrap">
  <div class="top"><img src="../../icons/icon128.png" alt=""><div class="title">Gradescope+</div></div>
  <div class="tag">Next-due countdowns and grade memes</div>
  <div class="memes">
    <img src="../../images/tier1.png"><img src="../../images/tier3.png"><img src="../../images/tier5.png"><img src="../../images/tier9.png"><img src="../../images/tier12.png">
  </div>
</div>
